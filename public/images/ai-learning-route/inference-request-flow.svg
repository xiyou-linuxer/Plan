<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
    .title { font-size: 28px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 14px; fill: #6b7280; }
    .node-title { font-size: 15px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 11px; fill: #6b7280; }
    .label { font-size: 12px; font-weight: 600; fill: #374151; }
    .small { font-size: 11px; fill: #6b7280; }
    .legend { font-size: 12px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1240" height="760" fill="#ffffff"/>
  <text x="620" y="48" text-anchor="middle" class="title">一次推理请求从输入到输出的链路</text>
  <text x="620" y="74" text-anchor="middle" class="subtitle">prompt 进入服务后，被 tokenizer、scheduler、prefill、decode、KV Cache、sampler、detokenizer 串起来，最终流式返回给用户</text>

  <rect x="52" y="108" width="1136" height="250" rx="16" fill="#f8fafc" stroke="#d1d5db" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="76" y="138" class="label">主请求路径</text>

  <g filter="url(#shadow)">
    <rect x="84" y="176" width="132" height="78" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="150" y="206" text-anchor="middle" class="node-title">API 请求</text>
    <text x="150" y="228" text-anchor="middle" class="node-sub">prompt / max_tokens</text>
    <text x="150" y="246" text-anchor="middle" class="node-sub">temperature / top_p</text>

    <rect x="258" y="176" width="132" height="78" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="324" y="206" text-anchor="middle" class="node-title">Tokenizer</text>
    <text x="324" y="228" text-anchor="middle" class="node-sub">文本 prompt</text>
    <text x="324" y="246" text-anchor="middle" class="node-sub">转 token ids</text>

    <rect x="432" y="176" width="132" height="78" rx="10" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
    <text x="498" y="206" text-anchor="middle" class="node-title">Scheduler</text>
    <text x="498" y="228" text-anchor="middle" class="node-sub">队列 / batch</text>
    <text x="498" y="246" text-anchor="middle" class="node-sub">提高 GPU 利用率</text>

    <rect x="606" y="176" width="132" height="78" rx="10" fill="#faf5ff" stroke="#ddd6fe" stroke-width="1.5"/>
    <text x="672" y="206" text-anchor="middle" class="node-title">Prefill</text>
    <text x="672" y="228" text-anchor="middle" class="node-sub">处理完整 prompt</text>
    <text x="672" y="246" text-anchor="middle" class="node-sub">生成初始 KV</text>

    <rect x="780" y="176" width="132" height="78" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <text x="846" y="206" text-anchor="middle" class="node-title">Decode</text>
    <text x="846" y="228" text-anchor="middle" class="node-sub">每轮生成</text>
    <text x="846" y="246" text-anchor="middle" class="node-sub">一个新 token</text>

    <rect x="954" y="176" width="132" height="78" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="1020" y="206" text-anchor="middle" class="node-title">Sampler</text>
    <text x="1020" y="228" text-anchor="middle" class="node-sub">temperature</text>
    <text x="1020" y="246" text-anchor="middle" class="node-sub">top-p / top-k</text>
  </g>

  <path d="M 216 215 L 258 215" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 390 215 L 432 215" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 564 215 L 606 215" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 738 215 L 780 215" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <path d="M 912 215 L 954 215" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>

  <rect x="52" y="392" width="1136" height="196" rx="16" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="76" y="422" class="label">Decode 循环与 KV Cache</text>

  <g filter="url(#shadow)">
    <rect x="176" y="462" width="172" height="72" rx="10" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1.5"/>
    <text x="262" y="491" text-anchor="middle" class="node-title">模型前向计算</text>
    <text x="262" y="514" text-anchor="middle" class="node-sub">基于已有 token 和 KV</text>

    <rect x="444" y="462" width="172" height="72" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="530" y="491" text-anchor="middle" class="node-title">KV Cache</text>
    <text x="530" y="514" text-anchor="middle" class="node-sub">保存历史 attention 信息</text>

    <rect x="712" y="462" width="172" height="72" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="798" y="491" text-anchor="middle" class="node-title">采样新 token</text>
    <text x="798" y="514" text-anchor="middle" class="node-sub">得到下一轮输入</text>

    <rect x="980" y="462" width="132" height="72" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="1046" y="491" text-anchor="middle" class="node-title">停止判断</text>
    <text x="1046" y="514" text-anchor="middle" class="node-sub">EOS / max_tokens</text>
  </g>

  <path d="M 846 254 L 846 330 L 262 330 L 262 462" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="548" y="320" text-anchor="middle" class="small">进入 decode 循环</text>
  <path d="M 348 498 L 444 498" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 616 498 L 712 498" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 884 498 L 980 498" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 798 534 C 798 574, 262 574, 262 534" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
  <text x="532" y="568" text-anchor="middle" class="small">未结束：新 token 回到下一轮 decode</text>

  <g filter="url(#shadow)">
    <rect x="372" y="640" width="158" height="70" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="451" y="668" text-anchor="middle" class="node-title">Detokenizer</text>
    <text x="451" y="690" text-anchor="middle" class="node-sub">token 转回文本</text>

    <rect x="710" y="640" width="158" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="789" y="668" text-anchor="middle" class="node-title">流式返回</text>
    <text x="789" y="690" text-anchor="middle" class="node-sub">逐 token 展示给用户</text>
  </g>

  <path d="M 1046 534 L 1046 610 L 451 610 L 451 640" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="760" y="600" text-anchor="middle" class="small">结束后输出文本</text>
  <path d="M 530 675 L 710 675" stroke="#2563eb" stroke-width="2.2" fill="none" marker-end="url(#arrow-blue)"/>

  <path d="M 498 254 C 498 288, 760 288, 846 176" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#arrow-orange)"/>
  <text x="642" y="292" text-anchor="middle" class="small">多个请求动态组成 batch</text>

  <g transform="translate(72, 724)">
    <line x1="0" y1="0" x2="34" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <text x="44" y="4" class="legend">主数据流</text>
    <line x1="132" y1="0" x2="166" y2="0" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <text x="176" y="4" class="legend">scheduler batching</text>
    <line x1="330" y1="0" x2="364" y2="0" stroke="#059669" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="374" y="4" class="legend">KV / token 更新</text>
    <line x1="512" y1="0" x2="546" y2="0" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-purple)"/>
    <text x="556" y="4" class="legend">decode 循环</text>
  </g>

  <text x="1146" y="724" text-anchor="end" class="small">learn-AI · inference request flow</text>
</svg>
